const standardColumns = ['产品类别','产品库','产品品类','产品型号','产品系列','市场定位','产品规格','产品说明','产品分层','特约加盟商中心仓提货价格','退货周期及说明'];
let allData = [];
let filteredData = [];
let currentPage = 1;
const pageSize = 20; // 电脑、手机统一每页20条

function initDataRender(){
    allData = productData.map((item,idx)=>({id:idx+1,...item}));
    filteredData = [...allData];
    renderTable();
    document.getElementById('searchInput').addEventListener('input', handleSearch);
}

// 搜索过滤
function handleSearch(){
    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
    if(!kw) filteredData = [...allData];
    else filteredData = allData.filter(item=>standardColumns.some(k=>String(item[k]||'').toLowerCase().includes(kw)));
    currentPage = 1;
    renderTable();
}

// 重置搜索
function resetSearch(){
    document.getElementById('searchInput').value = '';
    filteredData = [...allData];
    currentPage = 1;
    renderTable();
}

// 表格渲染
function renderTable(){
    const tbody = document.getElementById('tableBody');
    const total = filteredData.length;
    const totalPages = Math.max(1, Math.ceil(total/pageSize));
    const start = (currentPage-1)*pageSize;
    const end = Math.min(currentPage*pageSize, total);
    const pageList = filteredData.slice(start, end);

    if(total === 0){
        tbody.innerHTML = `<tr><td colspan="12" class="py-20 text-center text-slate-400 text-base">暂无匹配的产品数据</tr>`;
    }else{
        tbody.innerHTML = pageList.map((item,idx)=>`
        <tr class="border-b border-slate-100">
            <td class="px-3 py-2.5 text-center text-slate-500">${start+idx+1}</td>
            <td class="px-3 py-2.5 text-center text-slate-800">${item['产品类别']||'-'}</td>
            <td class="px-3 py-2.5 text-center font-medium text-blue-600">${item['产品型号']||'-'}</td>
            <td class="px-3 py-2.5 text-center text-slate-600">${item['产品库']||'-'}</td>
            <td class="px-3 py-2.5 text-center text-slate-600">${item['产品品类']||'-'}</td>
            <td class="px-3 py-2.5 text-center text-slate-600">${item['产品系列']||'-'}</td>
            <td class="px-3 py-2.5 text-center"><span class="px-1.5 py-0.5 rounded text-xs ${getTag(item['市场定位'])}">${item['市场定位']||'-'}</span></td>
            <td class="px-3 py-2.5 text-center whitespace-nowrap text-slate-600">${item['产品规格']||'-'}</td>
            <td class="px-3 py-2.5 text-center max-w-xs truncate text-slate-600" title="${item['产品说明']||''}">${item['产品说明']||'-'}</td>
            <td class="px-3 py-2.5 text-center text-slate-600">${item['产品分层']||'-'}</td>
            <td class="px-3 py-2.5 text-center font-semibold text-red-500">¥${Number(item['特约加盟商中心仓提货价格']).toFixed(2)}</td>
            <td class="px-3 py-2.5 text-center text-slate-500 text-xs">${item['退货周期及说明']||'-'}</td>
        </tr>
        `).join('');
    }

    document.getElementById('totalCount').textContent = allData.length;
    document.getElementById('filteredCount').textContent = total;
    document.getElementById('showStart').textContent = total ? start+1 : 0;
    document.getElementById('showEnd').textContent = end;
    document.getElementById('currentPage').textContent = currentPage;
    document.getElementById('totalPages').textContent = totalPages;
    document.getElementById('prevBtn').disabled = currentPage <=1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
}

// 市场定位标签配色
function getTag(type){
    const map = {
        'S':'bg-fuchsia-100 text-fuchsia-700',
        'E':'bg-blue-100 text-blue-700',
        'C':'bg-emerald-100 text-emerald-700',
        'A':'bg-slate-100 text-slate-700'
    }
    return map[type] || 'bg-slate-100 text-slate-700';
}

// 分页逻辑
function prevPage(){
    if(currentPage>1){
        currentPage--;
        renderTable();
    }
}
function nextPage(){
    const total = filteredData.length;
    const tp = Math.ceil(total / pageSize);
    if(currentPage < tp){
        currentPage++;
        renderTable();
    }
}
</script>
